<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1A4F6E" />
    <title>Sowel — maison de démonstration</title>
    <!--
      The demo, side by side: Sowel on one side, the 3D house on the other, the
      divider wherever the visitor drags it.

      Two iframes on this same origin, so they share the guest session the landing
      page left in localStorage. Sowel refuses to be framed by default
      (`X-Frame-Options: DENY`, `frame-ancestors 'none'`); the proxy relaxes that to
      this origin only, for this page — a third-party site still cannot frame it.
      Neither app knows it is here: each is a client of the same Sowel, and the 3D
      moves when the interface acts because both hear the same WebSocket.
    -->
    <style>
      :root {
        --ocean: #1a4f6e;
        --ocean-dark: #144159;
        --light: #eef5f8;
        --line: #d5e2e9;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--light);
        font: 14px/1.4 Inter, system-ui, sans-serif;
        overflow: hidden;
      }
      .split {
        display: flex;
        height: 100dvh;
        width: 100vw;
      }
      .pane {
        position: relative;
        min-width: 0;
        min-height: 0;
        background: #fff;
      }
      .pane iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
      /* While dragging, the iframes would swallow the pointer the moment it
         crosses into them; nothing inside needs it until the drag is over. */
      .dragging .pane iframe {
        pointer-events: none;
      }
      .dragging {
        cursor: col-resize;
        user-select: none;
      }
      .divider {
        flex: 0 0 10px;
        position: relative;
        background: var(--line);
        cursor: col-resize;
        touch-action: none;
        outline: none;
      }
      .divider::after {
        /* The grip: three dots, so it reads as something to take hold of. */
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 4px;
        height: 28px;
        transform: translate(-50%, -50%);
        border-radius: 2px;
        background: radial-gradient(circle, var(--ocean) 1.5px, transparent 2px) 0 0 / 4px 9px
          repeat-y;
        opacity: 0.55;
      }
      .divider:hover,
      .divider:focus-visible,
      .dragging .divider {
        background: #b9d0dc;
      }
      .divider:focus-visible::after,
      .divider:hover::after {
        opacity: 1;
      }

      /* A phone: one above the other, the divider across. */
      @media (max-width: 800px) {
        .split {
          flex-direction: column;
        }
        .divider {
          cursor: row-resize;
        }
        .divider::after {
          width: 28px;
          height: 4px;
          background: radial-gradient(circle, var(--ocean) 1.5px, transparent 2px) 0 0 / 9px 4px
            repeat-x;
        }
        .dragging {
          cursor: row-resize;
        }
      }
    </style>
  </head>
  <body>
    <div class="split" id="split">
      <div class="pane" id="first">
        <iframe src="/dashboard" title="Sowel" id="sowel"></iframe>
      </div>
      <div
        class="divider"
        id="divider"
        role="separator"
        tabindex="0"
        aria-orientation="vertical"
        aria-valuemin="15"
        aria-valuemax="85"
        aria-label="Redimensionner — glisser, flèches, double-clic pour centrer"
        title="Glisser pour redimensionner · double-clic pour centrer"
      ></div>
      <div class="pane" id="second">
        <iframe src="/maison/" title="Maison 3D" id="house"></iframe>
      </div>
    </div>

    <script>
      // No session, no demo: both panes would show a login. The landing page is
      // what makes one, and it comes back here.
      try {
        if (!localStorage.getItem("sowel_access_token")) location.replace("/bienvenue");
      } catch {
        location.replace("/bienvenue");
      }

      const KEY = "showroom_split";
      const MIN = 15;
      const MAX = 85;
      const split = document.getElementById("split");
      const first = document.getElementById("first");
      const second = document.getElementById("second");
      const divider = document.getElementById("divider");
      const vertical = () => matchMedia("(max-width: 800px)").matches;

      /** Percent of the space the first pane takes. Remembered per browser. */
      let ratio = 50;
      try {
        const saved = Number(localStorage.getItem(KEY));
        if (saved >= MIN && saved <= MAX) ratio = saved;
      } catch {
        /* a preference that cannot be read is a preference not yet made */
      }

      function apply() {
        first.style.flex = `0 0 calc(${ratio}% - 5px)`;
        second.style.flex = `1 1 0`;
        divider.setAttribute("aria-valuenow", String(Math.round(ratio)));
        divider.setAttribute("aria-orientation", vertical() ? "horizontal" : "vertical");
      }

      function set(next, remember) {
        ratio = Math.min(MAX, Math.max(MIN, next));
        apply();
        if (remember) {
          try {
            localStorage.setItem(KEY, String(Math.round(ratio * 10) / 10));
          } catch {
            /* it holds for this visit */
          }
        }
      }

      divider.addEventListener("pointerdown", (event) => {
        divider.setPointerCapture(event.pointerId);
        document.body.classList.add("dragging");
      });
      divider.addEventListener("pointermove", (event) => {
        if (!divider.hasPointerCapture(event.pointerId)) return;
        const box = split.getBoundingClientRect();
        const at = vertical()
          ? ((event.clientY - box.top) / box.height) * 100
          : ((event.clientX - box.left) / box.width) * 100;
        set(at, false);
      });
      const release = (event) => {
        if (!divider.hasPointerCapture(event.pointerId)) return;
        divider.releasePointerCapture(event.pointerId);
        document.body.classList.remove("dragging");
        set(ratio, true);
      };
      divider.addEventListener("pointerup", release);
      divider.addEventListener("pointercancel", release);
      divider.addEventListener("dblclick", () => set(50, true));
      divider.addEventListener("keydown", (event) => {
        const step = event.shiftKey ? 10 : 2;
        const back = vertical() ? "ArrowUp" : "ArrowLeft";
        const forth = vertical() ? "ArrowDown" : "ArrowRight";
        if (event.key === back) set(ratio - step, true);
        else if (event.key === forth) set(ratio + step, true);
        else if (event.key === "Home") set(MIN, true);
        else if (event.key === "End") set(MAX, true);
        else return;
        event.preventDefault();
      });
      addEventListener("resize", apply);
      apply();
    </script>
  </body>
</html>
