# ============================================================
# The showroom stack (spec 001).
#
#   cp .env.example .env     # once, and fill it in
#   docker compose up -d
#   scripts/reset.sh
#
# Three deliberate properties:
#
#   - **Sowel's port is not published.** The only way in is the proxy, which is
#     what makes the deny list something a visitor cannot step around.
#   - **No Docker socket, ever.** A container with the socket is root on a host
#     that faces the internet (core spec 105). `scripts/check-compose.sh` refuses
#     one, and that check is not a formality.
#   - **Two volumes, not one.** The reset wipes SQLite and keeps InfluxDB, so the
#     history accrues from launch day while the house itself starts fresh.
# ============================================================

name: sowel-showroom

services:
  sowel:
    image: ${SOWEL_IMAGE:-ghcr.io/mchacher/sowel:latest}
    container_name: showroom-sowel
    restart: unless-stopped
    # No `ports:`. On purpose. See above.
    environment:
      - TZ=${HOME_TIMEZONE:-Europe/Paris}
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG:-sowel}
      - INFLUX_BUCKET=${INFLUX_BUCKET:-sowel}
    volumes:
      - sowel-data:/app/data
      - sowel-plugins:/app/plugins
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  influxdb:
    image: influxdb:2.7
    container_name: showroom-influxdb
    restart: unless-stopped
    volumes:
      - influxdb-data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUX_USERNAME:-sowel}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORG:-sowel}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET:-sowel}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN}
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  proxy:
    image: nginx:1.27-alpine
    container_name: showroom-proxy
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-8080}:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./landing:/usr/share/nginx/html:ro
    depends_on:
      - sowel
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  # Wiped by the reset: the house starts fresh every night.
  sowel-data:
  # Wiped by the reset: the plugin is reinstalled from the registry or a tarball.
  sowel-plugins:
  # **Kept** by the reset. History accrues from launch day; that is the decision.
  influxdb-data:
